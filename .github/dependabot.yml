version: 2
updates:
  # Actions are pinned by commit SHA; Dependabot proposes the SHA bump and
  # keeps the "# vX.Y.Z" comment current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The dev image base is pinned by digest (scripts/devenv/Dockerfile).
  - package-ecosystem: docker
    directory: "/scripts/devenv"
    schedule:
      interval: weekly
    commit-message:
      prefix: "dev-env"
