name: Release

# A tag v* produces a GitHub release carrying the rendered .plg, the package
# and SHA256SUMS. The plugin manager on Unraid downloads the package from the
# release and compares it with the sha256 rendered into the plg, so the files
# attached here are the only place the plugin ever installs from.
#
# Every tag is published as a full release, never a pre-release: the plg's
# pluginURL (and the Community Applications PluginURL, which must be identical)
# is "releases/latest/download/claude-code-unraid.plg", and GitHub resolves
# "latest" only to full releases. Beta status is carried by the version itself
# (v0.1.0-beta.1) and by the Beta flag in the CA entry. To publish a build for
# testers only, mark the release as a pre-release afterwards
# (gh release edit TAG --prerelease): installed copies then keep seeing the
# previous full release as "latest".

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: build, lint and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout (with tags, for the date-based plugin version)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: make check
        run: ./scripts/dev-env make check

      - name: Build the package and render the plg
        id: build
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(./scripts/dev-env scripts/plugin-version --tag "$TAG")"
          semver="$(./scripts/dev-env scripts/plugin-version --tag "$TAG" --semver)"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$TAG")"
          export SOURCE_DATE_EPOCH
          rm -rf dist
          ./scripts/dev-env scripts/build-txz --version "$version" --out-dir dist
          txz="$(ls dist/*.txz)"
          txz_name="$(basename "$txz")"
          ./scripts/dev-env scripts/render-plg --version "$version" --plugin-version "$semver" \
            --txz "$txz" --txz-url "https://github.com/${REPO}/releases/download/${TAG}/${txz_name}" \
            --out "dist/claude-code-unraid.plg"
          ./scripts/dev-env scripts/lint-plg dist/claude-code-unraid.plg
          ./scripts/dev-env bash -c 'cd dist && sha256sum -- *.txz *.plg > SHA256SUMS'
          if ! ./scripts/dev-env scripts/changelog-extract --version "$semver" > dist/notes.md; then
            printf 'See CHANGELOG.md for this release.\n' > dist/notes.md
          fi
          {
            echo
            echo "Plugin version: \`$version\` (tag $TAG)"
            echo "Claude Code: \`$(sed -n 's/^CLAUDE_VERSION=//p' release/claude-code.lock)\` (sha256 pinned from Anthropic's signed manifest)"
            echo
            echo "Install URL: \`https://github.com/${REPO}/releases/download/${TAG}/claude-code-unraid.plg\`"
          } >> dist/notes.md
          {
            echo "version=$version"
            echo "semver=$semver"
          } >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "$TAG (plugin $VERSION)" --notes-file dist/notes.md \
            dist/claude-code-unraid.plg dist/*.txz dist/SHA256SUMS
